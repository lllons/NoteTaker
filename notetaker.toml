[notetaker]
# The web selector starts at the official large-v3 checkpoint and includes
# additional public faster-whisper CTranslate2 models from Hugging Face.
# faster-whisper choices load on CPU with int8 weights. The three larger
# Transformers choices use CPU float32 and are installed from the optional
# requirements-large-models.txt file.
model = "large-v3"
# Reuse the same loaded model for partials so CPU memory is not doubled.
draft_model = "large-v3"
language = "auto"
beam_size = 8
threads = 0
# Comma-separated names, jargon, code terms, or product names for Whisper prompting.
hotwords = ""
data_dir = "data"
context_chars = 1200
max_segment_seconds = 30
min_segment_seconds = 0.15
# Recall-first listening boundaries: keep quiet starts, pauses, and trailing words.
vad_on_threshold = 0.35
vad_off_threshold = 0.20
preroll_seconds = 1.0
end_silence_seconds = 1.4
partial_seconds = 4.0
provider_timeout = 45
# labels-only preserves speaker fields without pretending heuristic labels are diarization.
diarization = "labels-only"

# Optional OpenAI-compatible enrichment provider. Leave blank for local deterministic mode.
# llm_base_url = "https://your-provider.example/v1"
# llm_model = "your-json-capable-model"
